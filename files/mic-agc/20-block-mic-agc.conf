# Installed by kali-cosmic-setup (module mic-agc).
#
# Browsers and Electron apps (Meet, Zoom in a browser, Teams...) run a WebRTC
# automatic gain control that keeps moving the system microphone volume.
# block-source-volume makes PipeWire ignore volume changes from the matched
# clients, so the microphone stays where you set it. The COSMIC sound applet,
# pavucontrol and wpctl are not matched and still change it.
#
# Matched binaries (application.process.binary, anchored regex): Kali's Firefox
# (firefox-esr), Firefox from other sources (firefox), Chromium, Brave, VS Code
# (code) and generic Electron apps (electron).
#
# To cover another app, add its binary name inside the regex, using the name
# printed while the app is capturing by:
#   pactl list source-outputs | grep application.process.binary
# then restart the service: systemctl --user restart pipewire-pulse
pulse.rules = [
    {
        matches = [
            { application.process.binary = "~^(chromium|brave|firefox|firefox-esr|code|electron)$" }
        ]
        actions = { quirks = [ block-source-volume ] }
    }
]
