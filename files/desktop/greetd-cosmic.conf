# Drop-in for Debian's greetd.service, installed by kali-cosmic-setup as
# /etc/systemd/system/greetd.service.d/cosmic-greeter.conf.
# Source: the ExecStart and daemon ordering come from pop-os/cosmic-greeter,
# tag epoch-1.11.0 (cosmic-greeter.service). Why a drop-in: Debian's greetd
# package is a debconf display manager and its postinst relinks
# display-manager.service to greetd.service on every configure, so the display
# manager must be Debian's own greetd.service, started with the COSMIC config.
[Unit]
Wants=cosmic-greeter-daemon.service
After=cosmic-greeter-daemon.service

[Service]
ExecStart=
ExecStart=/usr/sbin/greetd --config /etc/greetd/cosmic-greeter.toml
