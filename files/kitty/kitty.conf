# Window
hide_window_decorations yes
window_padding_width 8

# Frosted glass
background_opacity 0.65
background_blur 1

# Cursor trail
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Animated cursor blink
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0

# No bell (no flash, no beep)
visual_bell_duration 0.0
enable_audio_bell no

# Smooth scrolling (kitty 0.46+)
pixel_scroll yes
momentum_scroll 0.96

# Selection colors generated from the COSMIC accent (see kitty-cosmic-colors.sh)
include cosmic-colors.conf

# Ctrl+Shift+K: clear screen and scrollback, keep the current prompt
map ctrl+shift+k combine : clear_terminal scrollback active : clear_terminal to_cursor active
